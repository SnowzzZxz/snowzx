<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snowzx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --text:#fff; --text-dim:#888;
    --card:rgba(15,15,15,.45); --border:rgba(255,255,255,.08);
    --accent:#55ffff; --accent-2:#a855f7; --green:#4ade80;
    --font:'Inter',sans-serif; --font-display:'Fraunces',serif; --font-mono:'Space Grotesk',monospace;
    
    /* Cores para o card da PYPAG */
    --glass: rgba(255,255,255,0.10);
    --glass-strong: rgba(255,255,255,0.16);
    --glass-border: rgba(255,255,255,0.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }

  /* ===== TELA DE CADEADO ===== */
  .lock-screen{
    position:fixed;inset:0;z-index:999;
    display:flex;align-items:center;justify-content:center;
    background:#000;
    transition:opacity .8s ease .4s,visibility .8s ease .4s;
  }
  .lock-screen.unlocked{opacity:0;visibility:hidden;pointer-events:none}
  
  .lock-icon{
    width:72px;height:72px; cursor:pointer;
    filter:drop-shadow(0 0 0px rgba(255,255,255,0));
    transition:transform .2s ease,filter .3s ease;
  }
  
  .lock-svg{width:100%;height:100%;overflow:visible}
  
  .shackle {
    fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .5s cubic-bezier(0.34, 1.2, 0.64, 1), stroke .5s ease;
    transform-origin: 60px 45px; 
  }
  .body { fill: #fff; stroke: none; transition: fill .5s ease; }
  .keyhole { fill: #000; stroke: none; }

  .lock-icon.opening {
    filter:drop-shadow(0 0 15px rgba(74, 222, 128, 0.6)) drop-shadow(0 0 30px rgba(74, 222, 128, 0.3));
  }
  .lock-icon.opening .shackle { transform: rotate(40deg); stroke: var(--green); }
  .lock-icon.opening .body { fill: var(--green); }

  /* ===== RESTO DO SITE (PERFIL) ===== */
  .main-content{opacity:0; visibility:hidden; transition:opacity 0.5s ease, transform 0.5s ease;}
  .main-content.show{opacity:1; visibility:visible;}
  .main-content.hidden{opacity:0; visibility:hidden; transform:scale(0.98);}

  .bg-image{
    position:fixed;inset:0;z-index:-5;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    filter: brightness(0.6); 
  }

  .bg-video{
    position:fixed;inset:0;z-index:-4; width:100vw;height:100vh;
    object-fit:cover; opacity: 0.08; pointer-events:none;
  }

  .bg-fallback{
    position:fixed;inset:0;z-index:-6;
    background:
      radial-gradient(circle at 20% 15%, rgba(85,255,255,.12), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(168,85,247,.12), transparent 45%),
      radial-gradient(circle at 50% 50%, #0a0a10 0%, #000 70%);
    animation:bgShift 18s ease-in-out infinite alternate;
  }
  @keyframes bgShift{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-2%,2%)}}
  
  .fog{
    position:fixed;inset:0;z-index:-2;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.75) 100%);
    pointer-events:none;
  }

  .audio-toggle{
    position:fixed;top:20px;right:20px;z-index:60;
    display:flex;align-items:center;justify-content:center;
    width:44px;height:44px;
    background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:50%;
    cursor:pointer; color:var(--text-dim);
    transition:all .3s ease;
    transform:translateY(-10px); 
  }
  .main-content.show .audio-toggle{ transform:translateY(0); transition:transform .6s .4s, color .3s, border-color .3s; }
  .audio-toggle:hover{ border-color:var(--accent); color:var(--accent); }
  .audio-toggle svg{width:20px;height:20px}
  .audio-toggle .icon-muted{display:none}
  .audio-toggle.muted .icon-vol{display:none}
  .audio-toggle.muted .icon-muted{display:block}

  .hero{
    display:flex;flex-direction:column;align-items:center; text-align:center;
    padding:60px 24px 40px; min-height:100vh; justify-content:center; position:relative; z-index:2;
  }
  
  .reveal{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.22,.86,.32,1.04),transform .8s cubic-bezier(.22,.86,.32,1.04)}
  .main-content.show .reveal{opacity:1;transform:translateY(0)}
  .reveal.d1{transition-delay:.1s} .reveal.d2{transition-delay:.2s}
  .reveal.d3{transition-delay:.3s} .reveal.d4{transition-delay:.4s}

  .avatar{
    width:110px;height:110px;border-radius:50%; object-fit:cover;
    border: 2px solid rgba(255,255,255,0.8); 
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    margin-bottom: 24px; background:#111;
  }
  
  .name{
    font-family:var(--font-display); font-size:clamp(48px, 8vw, 86px);
    font-weight: 500; line-height:1; letter-spacing:-0.02em; margin-bottom: 16px;
    color: #d1d5db; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  
  .tagline {
    font-family: var(--font); font-size: 15px; color: #9ca3af;
    max-width: 480px; line-height: 1.6; margin-bottom: 36px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  .btn-apoio {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(18, 24, 38, 0.6); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
    padding: 12px 32px; border-radius: 999px; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all .3s ease; font-family: inherit;
  }

  .btn-apoio:hover {
    background: rgba(30, 40, 60, 0.8); border-color: #fff;
    transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .btn-apoio svg { width: 16px; height: 16px; fill: #fff; }

  .counter{
    position:fixed;bottom:20px;left:20px;z-index:40; display:flex;align-items:center;gap:8px;
    background:var(--card); backdrop-filter:blur(14px); border:1px solid var(--border);
    border-radius:999px; padding:8px 16px; font-size:12px;color:var(--text-dim);
    font-family:var(--font-mono); transform:translateY(20px); transition:transform .6s .6s;
  }
  .main-content.show .counter{transform:translateY(0)}
  .counter svg{color:var(--accent)}

  .marca{
    position:fixed;bottom:20px;right:20px;z-index:40; font-family:var(--font-mono);
    font-size:12px;letter-spacing:.3em; text-transform:uppercase; color:var(--text-dim);
    text-decoration:none; transition:color .2s; transform:translateY(20px);
  }
  .main-content.show .marca{transform:translateY(0);transition:transform .6s .7s,color .2s}
  .marca:hover{color:var(--accent)}

  /* ============================================================
     TELA DE CHECKOUT (ESTILO PYPAG)
     ============================================================ */
  .checkout-container {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .checkout-container.active {
    opacity: 1; pointer-events: auto;
  }

  .checkout-scene {
    position: absolute; inset: 0; z-index: -1;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    background: rgba(0,0,0,0.3);
  }

  .card {
    position: relative; z-index: 2;
    width: 100%; max-width: 420px;
    padding: clamp(14px, 3vw, 22px);
    border-radius: 26px;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,.18);
    transform: translateY(20px); transition: transform 0.4s ease;
    max-height: 90vh; overflow-y: auto;
  }
  .checkout-container.active .card { transform: translateY(0); }

  /* Scroll customizado no card */
  .card::-webkit-scrollbar { width: 6px; }
  .card::-webkit-scrollbar-track { background: transparent; }
  .card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  .voltar {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 999px; text-decoration: none;
    font-size: 12px; color: var(--text);
    background: var(--glass); border: 1px solid var(--glass-border);
    transition: all 0.2s; cursor: pointer; margin-bottom: 20px; border: none; background: transparent; padding: 0;
  }
  .voltar:hover { color: #fff; }

  .card-topo{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .card-topo img{ width:54px; height:54px; border-radius:50%; object-fit:cover; background:var(--glass); border:1px solid var(--glass-border); }
  .card-nome{ font-size:17px; font-weight:600; color: #fff;}
  .card-sub{ font-size:12px; margin-top:3px; color: rgba(255,255,255,0.7); }

  .card-desc{ font-size:13px; margin-bottom:20px; color: rgba(255,255,255,0.8); line-height: 1.5;}

  .valores{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .valores button{
    padding:13px 4px; border-radius:14px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:500;
    color:var(--text); background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    transition:background .2s, border-color .2s, transform .2s;
  }
  .valores button:hover{ background:rgba(255,255,255,.14); }
  .valores button:active{ transform:scale(.96); }
  .valores button.sel{ background:var(--text); color:#141416; border-color:transparent; font-weight:600; }

  .campo{ margin-top:16px; }
  .campo label{ display:block; font-size:12px; margin-bottom:7px; color: rgba(255,255,255,0.8); }
  .campo input,.campo textarea{
    width:100%; padding:13px 15px; border-radius:14px;
    font-family:inherit; font-size:14px; color:var(--text);
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.16);
    transition:border-color .2s, background .2s;
  }
  .campo textarea{ resize:vertical; min-height:76px; }
  .campo input:focus,.campo textarea:focus{ outline:none; border-color:var(--text); background:rgba(0,0,0,.4); }
  .campo input::placeholder,.campo textarea::placeholder{ color:rgba(255,255,255,.35); }

  .btn-principal{
    width:100%; margin-top:22px; padding:16px; border-radius:16px;
    font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;
    color:#141416; background:var(--text); border:none;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .2s, box-shadow .2s, opacity .2s;
  }
  .btn-principal:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 14px 36px rgba(0,0,0,.45); }
  .btn-principal:active:not(:disabled){ transform:translateY(0) scale(.99); }
  .btn-principal:disabled{ opacity:.55; cursor:not-allowed; }

  .aviso{ margin-top:16px; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.5; display:none; }
  .aviso.on{ display:block; }
  .aviso.erro{ background:rgba(255,60,80,.14); border:1px solid rgba(255,90,110,.4); color:#ffd7dd; }

  /* PIX */
  .pix{ display:none; margin-top:20px; text-align:center; }
  .pix.on{ display:block; }
  .pix img{ width:200px; height:200px; margin:0 auto 16px; border-radius:16px; background:#fff; padding:10px; }
  .pix-code{
    width:100%; font-family:ui-monospace,Consolas,monospace; font-size:11px;
    word-break:break-all; text-align:left; padding:12px; border-radius:12px;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.14); color:var(--text);
    max-height:96px; overflow:auto;
  }
  .pix-acoes{ display:flex; gap:8px; margin-top:12px; }
  .pix-acoes button{
    flex:1; padding:12px; border-radius:12px; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:500; color:var(--text);
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
  }
  .pix-acoes button:hover{ background:rgba(255,255,255,.16); }
  .pix-status{ margin-top:14px; font-size:13px; color: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; gap: 8px;}
  
  .spinner-mini {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media(max-width:600px){
    .counter{bottom:14px;left:14px;padding:6px 12px}
    .marca{bottom:14px;right:14px} .hero{padding-top:80px}
    .audio-toggle{top:14px; right:14px;}
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-icon" id="lockIcon">
    <svg class="lock-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path class="shackle" d="M 30 45 V 25 A 20 20 0 0 1 70 25 V 45" />
      <rect class="body" x="24" y="45" width="52" height="36" rx="12" />
      <circle class="keyhole" cx="50" cy="60" r="5" />
      <rect class="keyhole" x="47" y="62" width="6" height="10" rx="3" />
    </svg>
  </div>
</div>

<div class="main-content" id="mainContent">
  <div class="bg-image" id="bgImage"></div>
  <div class="bg-fallback"></div>
  
  <video class="bg-video" id="bgVideo" loop playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
  </video>
  
  <div class="fog"></div>

  <div class="audio-toggle" id="audioToggle" title="Mutar/Desmutar">
    <svg class="icon-vol" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <svg class="icon-muted" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM19 6l-12 12"/></svg>
  </div>

  <main class="hero">
    <img class="avatar reveal d1" id="avatar" alt="">
    <h1 class="name reveal d2" id="name"></h1>
    <p class="tagline reveal d3" id="tagline"></p>
    
    <!-- BOTÃO APOIAR (Abre o checkout) -->
    <button class="btn-apoio reveal d4" id="btnApoiar">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9.2C1.3 8.2 3.4 5 6.8 5c2 0 3.5 1.1 4.3 2.3l.9 1.3.9-1.3C13.7 6.1 15.2 5 17.2 5c3.4 0 5.5 3.2 4.1 6.8C19.5 16.4 12 21 12 21z"/></svg>
      <span>Apoiar</span>
    </button>
  </main>

  <div class="counter">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
    <span id="visitas">0</span> visitas
  </div>

  <a class="marca" href="#">nao chorax</a>
</div>

<!-- ============================================================
     TELA DE CHECKOUT (ESTILO PYPAG)
     ============================================================ -->
<div class="checkout-container" id="viewCheckout">
  <div class="checkout-scene" id="btnFecharCheckout"></div>
  
  <section class="card" aria-labelledby="cardNome">
    
    <header class="card-topo">
      <img id="avatarCheckout" alt="">
      <div>
        <div class="card-nome" id="cardNome">Snowzx</div>
        <div class="card-sub">Apoie via PIX</div>
      </div>
    </header>

    <p class="card-desc" id="descCheckout"></p>

    <!-- FORMULÁRIO -->
    <form id="formCheckout">
      <div class="valores" role="group" aria-label="Valor da doação">
        <button type="button" data-v="5">R$ 5</button>
        <button type="button" data-v="10">R$ 10</button>
        <button type="button" data-v="20">R$ 20</button>
        <button type="button" data-v="50">R$ 50</button>
        <button type="button" data-v="100">R$ 100</button>
        <button type="button" data-v="">Outro</button>
      </div>

      <div class="campo" id="campoOutro" hidden>
        <label for="valorOutro">Valor</label>
        <input id="valorOutro" type="text" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off">
      </div>

      <div class="campo">
        <label for="nomeDoador">Seu nome</label>
        <input id="nomeDoador" type="text" maxlength="100" placeholder="Como quer aparecer" autocomplete="name">
      </div>

      <div class="campo">
        <label for="msgDoador">Mensagem <span style="opacity:.85">(opcional)</span></label>
        <textarea id="msgDoador" maxlength="500" placeholder="Deixe um recado"></textarea>
      </div>

      <button class="btn-principal" type="submit" id="btnGerarPix">
        <span id="btnRotulo">Apoiar com</span> <span id="btnValor">R$ 10,00</span>
      </button>
    </form>

    <div class="aviso erro" id="erroCheckout"></div>

    <!-- ÁREA DO PIX GERADO -->
    <div class="pix" id="pixArea">
      <img id="qrCodeImg" alt="QR Code do PIX">
      <div class="pix-code" id="pixCodigo"></div>
      <div class="pix-acoes">
        <button type="button" id="btnCopiarPix">Copiar código PIX</button>
        <button type="button" id="btnNovaDoacao">Nova doação</button>
      </div>
      <p class="pix-status" id="statusPix" role="status" aria-live="polite"></p>
    </div>

    <button class="voltar" id="btnVoltar" style="margin-top: 20px; text-align: center; width: 100%; display: block; padding: 10px;">&larr; voltar ao perfil</button>

  </section>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO DO PERFIL
   ============================================================ */
const perfil = {
  nome: "Snowzx",
  tagline: "Entre o barulho do mundo, escolhi o silêncio.",
  avatar: "avatar.png",
  imagemBg: "fundo.jpg",
};

// ⚠️ COLOQUE AS URLS DO SEU BACKEND AQUI (ZPay)
// Se você hospedou os arquivos Node.js na Vercel, as URLs ficam tipo:
// https://seu-projeto.vercel.app/api/criar
// https://seu-projeto.vercel.app/api/consultar
const API_URLS = {
  criar: "https://SEU-BACKEND-AQUI/api/criar-pix",   
  consultar: "https://SEU-BACKEND-AQUI/api/consultar-pix" 
};

/* ============================================================
   Lógica do cadeado e áudio
   ============================================================ */
const lockScreen = document.getElementById('lockScreen');
const lockIcon = document.getElementById('lockIcon');
const mainContent = document.getElementById('mainContent');
const video = document.getElementById('bgVideo');
const bgImage = document.getElementById('bgImage');
const audioToggle = document.getElementById('audioToggle');

if (perfil.imagemBg) bgImage.style.backgroundImage = `url('${perfil.imagemBg}')`;
video.muted = true;

lockIcon.addEventListener('click', () => {
  lockIcon.classList.add('opening');
  video.muted = false; 
  video.volume = 0.6; 
  video.play().catch(e => console.log("Erro ao tocar vídeo:", e));
  audioToggle.classList.remove('muted');

  setTimeout(() => {
    lockScreen.classList.add('unlocked');
    mainContent.classList.add('show');
  }, 1200);
});

audioToggle.addEventListener('click', () => {
  if (video.muted) { video.muted = false; audioToggle.classList.remove('muted'); }
  else { video.muted = true; audioToggle.classList.add('muted'); }
});

// Popula dados do perfil e do checkout
document.getElementById("avatar").src = perfil.avatar;
document.getElementById("name").textContent = perfil.nome;
document.getElementById("tagline").textContent = perfil.tagline;

document.getElementById("avatarCheckout").src = perfil.avatar;
document.getElementById("cardNome").textContent = perfil.nome;
document.getElementById("descCheckout").textContent = perfil.tagline;

let vis = parseInt(localStorage.getItem("visitas") || "0", 10) + 1;
localStorage.setItem("visitas", vis);
document.getElementById("visitas").textContent = vis;

/* ============================================================
   NAVEGAÇÃO ENTRE TELAS
   ============================================================ */
const viewCheckout = document.getElementById('viewCheckout');

document.getElementById('btnApoiar').addEventListener('click', () => {
  mainContent.classList.add('hidden');
  setTimeout(() => {
    viewCheckout.classList.add('active');
  }, 100);
});

const fecharCheckout = () => {
  viewCheckout.classList.remove('active');
  setTimeout(() => {
    mainContent.classList.remove('hidden');
  }, 100);
};

document.getElementById('btnVoltar').addEventListener('click', fecharCheckout);
document.getElementById('btnFecharCheckout').addEventListener('click', fecharCheckout);

/* ============================================================
   LÓGICA DE PAGAMENTO PIX (INTEGRAÇÃO ZPAY)
   ============================================================ */
const formCheckout = document.getElementById('formCheckout');
const btnGerarPix = document.getElementById('btnGerarPix');
const erroCheckout = document.getElementById('erroCheckout');
const pixArea = document.getElementById('pixArea');
const btnRotulo = document.getElementById('btnRotulo');
const btnValor = document.getElementById('btnValor');

let valorSelecionado = 10;
let timerStatus = null;

// --- Lógica do valor ---
const parseValor = txt => {
  const limpo = String(txt).replace(/[^\d,.]/g, '').replace(/\.(?=.*[.,])/g, '').replace(',', '.');
  const n = parseFloat(limpo);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
};
const fmtBRL = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const campoOutro = document.getElementById('campoOutro');
const inputValorOutro = document.getElementById('valorOutro');
const botoesValor = [...document.querySelectorAll('.valores button')];

const marcarBotao = (btn) => {
  botoesValor.forEach(b => b.classList.toggle('sel', b === btn));
  btnValor.textContent = fmtBRL(valorSelecionado);
};

botoesValor.forEach(b => b.addEventListener('click', (e) => {
  e.preventDefault();
  const v = b.getAttribute('data-v');
  if (v) { 
    valorSelecionado = Number(v); 
    campoOutro.hidden = true; 
  } else {
    campoOutro.hidden = false;
    inputValorOutro.focus();
    valorSelecionado = parseValor(inputValorOutro.value || '');
  }
  marcarBotao(b);
}));

inputValorOutro?.addEventListener('input', () => {
  valorSelecionado = parseValor(inputValorOutro.value);
  btnValor.textContent = fmtBRL(valorSelecionado);
});

// Inicia com o segundo botão (R$10) selecionado
if (botoesValor[1]) marcarBotao(botoesValor[1]);

// --- Envio do form ---
formCheckout.addEventListener('submit', async (e) => {
  e.preventDefault();
  erroCheckout.style.display = 'none';
  pixArea.classList.remove('on');

  if (!(valorSelecionado >= 1)) {
    erroCheckout.textContent = 'Informe um valor de R$ 1,00 ou mais.';
    erroCheckout.style.display = 'block';
    return;
  }
  const nomeDoador = document.getElementById('nomeDoador').value.trim();
  if (nomeDoador.length < 3) {
    erroCheckout.textContent = 'Escreva seu nome (mínimo 3 letras).';
    erroCheckout.style.display = 'block';
    return;
  }

  btnGerarPix.disabled = true;
  const textoOriginal = btnRotulo.textContent;
  btnRotulo.textContent = 'Gerando PIX…';

  try {
    const response = await fetch(API_URLS.criar, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        valor: valorSelecionado, 
        nome_cliente: nomeDoador 
      })
    });

    const data = await response.json();
    if (!data.success) throw new Error(data.error || "Erro ao gerar Pix");

    // Esconde form, mostra pix
    formCheckout.style.display = 'none';
    pixArea.classList.add('on');
    
    document.getElementById('pixCodigo').textContent = data.pixCode;
    document.getElementById('qrCodeImg').src = data.qrCode;

    // Inicia checagem de pagamento
    iniciarChecagem(data.paymentId);

  } catch (err) {
    console.error(err);
    erroCheckout.textContent = err.message;
    erroCheckout.style.display = 'block';
    btnGerarPix.disabled = false;
    btnRotulo.textContent = textoOriginal;
  }
});

// --- Checar status do pagamento ---
function iniciarChecagem(paymentId) {
  if (timerStatus) clearInterval(timerStatus);
  
  const statusEl = document.getElementById('statusPix');
  statusEl.innerHTML = `<div class="spinner-mini"></div><span>Aguardando pagamento...</span>`;

  timerStatus = setInterval(async () => {
    try {
      const res = await fetch(`${API_URLS.consultar}?id=${paymentId}`);
      const data = await res.json();

      if (data.success && data.isPaid) {
        clearInterval(timerStatus);
        statusEl.innerHTML = '<span style="color:#4ade80; font-weight:bold;">Pagamento Confirmado! Obrigado! ❤️</span>';
        setTimeout(() => {
          alert("Muito obrigado pelo apoio!");
        }, 1000);
      }
    } catch (err) {
      console.error("Erro na checagem", err);
    }
  }, 3000);
}

// --- Botão Copiar ---
document.getElementById('btnCopiarPix').addEventListener('click', async () => {
  const btn = document.getElementById('btnCopiarPix');
  const codigo = document.getElementById('pixCodigo').textContent;
  try { 
    await navigator.clipboard.writeText(codigo); 
  } catch {
    const t = document.createElement('textarea'); t.value = codigo; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  btn.textContent = 'Copiado!';
  setTimeout(() => { btn.textContent = 'Copiar código PIX'; }, 2000);
});

// --- Botão Nova Doação ---
document.getElementById('btnNovaDoacao').addEventListener('click', () => {
  if (timerStatus) clearInterval(timerStatus);
  pixArea.classList.remove('on');
  formCheckout.style.display = '';
  btnGerarPix.disabled = false;
  btnRotulo.textContent = 'Apoiar com';
  btnValor.textContent = fmtBRL(valorSelecionado);
});

</script>
</body>
</html>
